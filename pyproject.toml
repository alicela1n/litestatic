[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "aerographite"
version = "1.0.0"
authors = [
  { name="Alice Sell", email="alice@alicela1n.space" },
]
description = "Tiny lightweight static site generator written in Python that uses markdown and liquid to generate a website."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "feedgen",
    "marko",
    "python-frontmatter",
    "python-liquid",
    "pygments",
    "pyyaml"
]

[tool.setuptools]
packages = ["aerographite"]

[tool.setuptools.package-dir]
aerographite = "src/aerographite"

[tool.setuptools.package-data]
"aerographite" = ["*.yaml"]
[project.scripts]
aerographite = "aerographite:main"

[project.urls]
Homepage = "https://gitlab.com/alicela1n/aerographite"
Issues = "https://gitlab.com/alicela1n/aerographite/issues"
